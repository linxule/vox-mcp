name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies (validate lockfile)
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Unit tests
        run: uv run pytest tests/ -q -m "not integration"

      - name: Audit locked dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt > /dev/null
          uv run pip-audit -r /tmp/requirements-audit.txt --disable-pip --no-deps
